# Runs every test on each push and pull request (Ubuntu: the tests need no real Electron, only Node, Playwright's Chromium and Python 3)
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install (without downloading Electron itself)
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Python libraries (two tests read the app's pictures with them)
        run: pip install pillow numpy scipy
      - name: Chromium for the window tests
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: npm test
