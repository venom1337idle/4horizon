# Runs every test on each push and pull request, on Ubuntu AND on Windows (1.0.7: the users are on Windows, and some problems only show there:
# backslashes in paths, the Windows text encoding, "python" instead of "python3"). The tests need no real Electron, only Node, Playwright's Chromium and Python 3.
name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false                 # one system failing does not stop the other: both results are seen
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'                  # Python reads and writes UTF-8 on Windows too (as on Linux)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install (without downloading Electron itself)
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Python libraries (two tests read the app's pictures with them)
        run: pip install pillow numpy scipy
      - name: Chromium for the window tests
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: npm test
